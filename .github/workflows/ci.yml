name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Syntax check scripts
        run: python -m py_compile fetch_sources.py ingest.py anime_rag.py smoke_test.py

      - name: Build curated RAG index and run smoke tests
        env:
          ANONYMIZED_TELEMETRY: "False"
        run: |
          python ingest.py
          python smoke_test.py
